name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgresql://netsifr:netsifr_ci_password@localhost:5432/netsifr_ci
  AUTH_SECRET: ci-only-secret-not-for-production-use-1234567890
  AUTH_URL: http://localhost:3000

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netsifr
          POSTGRES_PASSWORD: netsifr_ci_password
          POSTGRES_DB: netsifr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netsifr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Applies migrations the same way production does — never `migrate dev` here.
      - name: Apply migrations to a clean database
        run: npm run db:migrate:deploy

      - name: Unit + integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed + e2e tests
        run: |
          npm run db:seed
          npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
